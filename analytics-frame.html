<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="robots" content="noindex, nofollow">
 <meta name="referrer" content="no-referrer">
 <title>Website analytics</title>
 <script>
 (() => {
  const productionOrigin = 'https://www.melbournecommercialrepairs.com.au';
  if (window.parent === window || window.origin !== 'null' || document.referrer) return;

  function start(event) {
   const view = event.data;
   if (event.source !== window.parent || event.origin !== productionOrigin || view?.kind !== 'ellis-analytics-view') return;
   const {id, pageLocation, pageReferrer, pageTitle} = view;
   if (typeof id !== 'string' || !/^G-[A-Z0-9]+$/.test(id) || typeof pageLocation !== 'string' ||
       typeof pageReferrer !== 'string' || typeof pageTitle !== 'string') return;
   const page = new URL(pageLocation, productionOrigin);
   if (page.origin !== productionOrigin || page.username || page.password || page.hash ||
       !/^\?lang=(?:en|zh)$/.test(page.search)) return;
   if (pageReferrer && (!/^https?:\/\//.test(pageReferrer) || new URL(pageReferrer).origin !== pageReferrer)) return;
   window.removeEventListener('message', start);

   // Sandbox access to document.cookie throws. Supply an empty cookie jar
   // for the tag's feature check without enabling storage or parent access.
   Object.defineProperty(document, 'cookie', {get: () => '', set() {}});
   // Denied-consent requests may also read referrer from the document.
   Object.defineProperty(document, 'referrer', {value: pageReferrer ? pageReferrer + '/' : ''});
   history.replaceState(null, '', page.href);
   document.title = pageTitle;

   window.dataLayer = window.dataLayer || [];
   function gtag() { window.dataLayer.push(arguments); }
   gtag('consent', 'default', {
    analytics_storage: 'denied',
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied'
   });
   gtag('set', 'ads_data_redaction', true);
   gtag('js', new Date());
   const pageFields = {page_location: page.href, page_referrer: pageReferrer};
   gtag('config', id, {
    ...pageFields,
    send_page_view: false,
    allow_google_signals: false,
    allow_ad_personalization_signals: false
   });
   gtag('event', 'page_view', pageFields);

   const script = document.createElement('script');
   script.async = true;
   script.referrerPolicy = 'no-referrer';
   script.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
   document.head.append(script);
  }
  window.addEventListener('message', start);
 })();
 </script>
</head>
<body></body>
</html>
